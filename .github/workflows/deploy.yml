# Build, push, deploy — on every push to main.
#
# This replaces CodePipeline, which cannot read from GitHub in ap-southeast-3.
# Authentication is OIDC: no AWS access key is stored anywhere in GitHub. The
# role's trust policy names this repository and this branch, so a workflow
# running anywhere else — a fork, a feature branch — is refused by AWS before
# it can touch a thing.
#
# Set one repository variable: AWS_DEPLOY_ROLE_ARN, from the platform's
# `github_deploy_role_arn` output.

name: Deploy

# Runs after CI, not alongside it. A push to main used to trigger both
# workflows at once, so a red test run still rolled to production; now the
# deploy starts only when CI has finished green on that commit. A manual
# dispatch skips the gate deliberately — for a rollback or a redeploy of a
# commit CI has already passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Needed to mint the OIDC token AWS will trust.
  contents: read

concurrency:
  # Two pushes in quick succession must not race each other into ECS; the
  # later one waits, and the service always ends up on the newest commit.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-3
  ECS_CLUSTER: karlo-prod
  SERVICE_NAME: masterdata-service
  CONTAINER_NAME: masterdata-service
  ECR_REPOSITORY: karlo/masterdata-service
  # The task definition family Terraform registered. Not derivable from the
  # service name — the families are abbreviated — so it is stated.
  TASK_FAMILY: karlo-prod-masterdata

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # On a workflow_run the checkout must name the commit CI tested; the
      # default would be whatever main points at by the time this starts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged by commit, never "latest": a tag must always mean the same
      # image, or a rollback cannot name what to roll back to. The repository
      # is IMMUTABLE for the same reason.
      - name: Build and push
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:sha-${DEPLOY_SHA::12}"
          # Tags are immutable, and a redeploy of a commit already built
          # (a manual dispatch to roll a config change, or a rollback) must
          # reuse its image rather than fail trying to overwrite it. The
          # same commit is the same image.
          # batch-get-image rather than describe-images: it is the read the
          # deploy role already holds for pulling, and a denied describe
          # looked like "not built" and tried to overwrite the immutable tag.
          if aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="sha-${DEPLOY_SHA::12}" \
               --query 'images[0].imageId.imageDigest' --output text 2>/dev/null | grep -q sha256; then
            echo "image already in ECR, reusing: $IMAGE"
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # The task definition is owned by Terraform, which ignores changes to its
      # container definitions precisely so this step can swap the image without
      # the next terraform apply rolling it back.
      - name: Fetch the current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-def.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      - name: Deploy and wait for the rollout
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER }}
          # Fails the job if the new tasks never become healthy, which is what
          # makes a bad deploy visible on the commit rather than in a dashboard.
          wait-for-service-stability: true
