basePath: /api/v1
definitions:
  github_com_karlo_masterdata-service_internal_models.Document:
    properties:
      companyId:
        type: string
      createdAt:
        type: string
      docType:
        type: string
      driverId:
        type: string
      expiresOn:
        type: string
      fileKey:
        description: |-
          The object-store key, never a URL: a signed URL expires, so a stored one
          rots. The key is resolved to a fresh URL when someone asks to see it.
        type: string
      id:
        type: string
      isVerified:
        type: boolean
      issuedOn:
        type: string
      notes:
        type: string
      number:
        type: string
      updatedAt:
        type: string
      vehicleId:
        description: |-
          Exactly one owner: a vehicle (STNK, KIR, insurance) or a driver (SIM,
          KTP, medical). VehicleID was the only owner once, so it stays a plain
          string; empty means "not a vehicle document".
        type: string
      verifiedByUserId:
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_models.Driver:
    properties:
      attributes:
        additionalProperties: true
        type: object
      companyId:
        type: string
      createdAt:
        type: string
      employeeNo:
        type: string
      fullName:
        type: string
      id:
        type: string
      licenseClass:
        type: string
      licenseExpiry:
        description: LicenseExpiry is a date; stored at UTC midnight, no time is meaningful.
        type: string
      licenseNo:
        type: string
      notes:
        type: string
      phone:
        type: string
      status:
        description: Status is active or inactive. Retirement is Deleted, like everywhere.
        type: string
      updatedAt:
        type: string
      userId:
        description: |-
          UserID is the auth user when this person has a login. Absent — not
          null — when nobody has looked: an import cannot assert there is no
          account, only that it did not link one.
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_models.GeoPoint:
    properties:
      coordinates:
        description: |-
          Longitude FIRST, then latitude. GeoJSON's order is the reverse of how
          coordinates are usually spoken, and getting it wrong puts an Indonesian
          site in the Indian Ocean without any error.
        items:
          type: number
        type: array
      type:
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_models.Site:
    properties:
      address:
        description: |-
          What the geocoder returned, stored so the lookup happens once rather than
          on every read — and because a coordinate alone cannot be shown to a
          driver or printed on a document.
          City and province are NAMES, not ids into a region table. There is no
          region table, and an id referencing nothing is worse than the name it
          stands for: it cannot be read, printed or searched without a lookup that
          does not exist.
        type: string
      attributes:
        additionalProperties: true
        type: object
      city:
        type: string
      companyId:
        type: string
      createdAt:
        type: string
      customerCompanyId:
        description: |-
          CustomerCompanyID says whose site this is when a transporter keeps
          its customers' warehouses in its own register (MyWarehouse groups
          them per customer). Empty for the company's own sites.
        type: string
      district:
        type: string
      geofenceRadiusM:
        description: |-
          How close counts as "arrived". Per site, because a roadside drop needs a
          wider radius than a fenced yard.
        type: integer
      id:
        type: string
      isActive:
        type: boolean
      location:
        $ref: '#/definitions/github_com_karlo_masterdata-service_internal_models.GeoPoint'
      name:
        type: string
      notes:
        type: string
      picUserIds:
        items:
          type: string
        type: array
      postcode:
        type: string
      province:
        type: string
      sitePicPhone:
        description: |-
          Who to call at the gate — the person in charge of this site, not the
          company switchboard.
        type: string
      siteType:
        $ref: '#/definitions/github_com_karlo_masterdata-service_internal_models.SiteType'
      street:
        type: string
      updatedAt:
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_models.SiteType:
    enum:
    - warehouse
    - depot
    - port
    - customer
    - other
    type: string
    x-enum-comments:
      SiteDepot: where a transporter keeps its fleet
      SitePort: a sea or dry port
      SiteWarehouse: a loading or unloading point on an order
    x-enum-descriptions:
    - a loading or unloading point on an order
    - where a transporter keeps its fleet
    - a sea or dry port
    - ""
    - ""
    x-enum-varnames:
    - SiteWarehouse
    - SiteDepot
    - SitePort
    - SiteCustomer
    - SiteOther
  github_com_karlo_masterdata-service_internal_models.TrackerAssignment:
    properties:
      companyId:
        type: string
      createdAt:
        type: string
      deviceId:
        type: string
      fittedAt:
        type: string
      id:
        type: string
      imei:
        type: string
      installNotes:
        type: string
      installPhotoKey:
        description: |-
          Proof the installation actually happened.

          Fitting is done in a yard, often by a subcontractor, and "was this really
          installed" is the first question when a device never reports. A photo
          taken at the time answers it. An object-store key, never a URL — a signed
          URL expires, so a stored one rots.
        type: string
      installedByUserId:
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/github_com_karlo_masterdata-service_internal_models.TrackerKind'
        description: |-
          What was fitted, copied from the device so the history outlives the
          device document. Kind and DeviceID always; IMEI for GPS devices only,
          because telemetry is keyed on it.
      trackerId:
        description: |-
          Nil once the device document is deleted. The copied IMEI below is what
          still identifies it — which is the whole reason the IMEI is duplicated
          here rather than joined from the tracker.
        type: string
      unfittedAt:
        type: string
      vehicleId:
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_models.TrackerKind:
    enum:
    - gps
    - dashcam
    type: string
    x-enum-varnames:
    - TrackerGPS
    - TrackerDashcam
  github_com_karlo_masterdata-service_internal_models.TrackerOwner:
    enum:
    - karlo
    - customer
    - vendor
    type: string
    x-enum-varnames:
    - OwnerKarlo
    - OwnerCustomer
    - OwnerVendor
  github_com_karlo_masterdata-service_internal_models.UnitType:
    enum:
    - rigid
    - head
    - body
    type: string
    x-enum-varnames:
    - UnitRigid
    - UnitHead
    - UnitBody
  github_com_karlo_masterdata-service_internal_models.Vehicle:
    properties:
      attributes:
        additionalProperties: true
        type: object
      brandId:
        type: string
      chassisNumber:
        description: |-
          The numbers that identify the PHYSICAL vehicle rather than its
          registration. A plate is reissued when a vehicle is sold; these are not,
          which is why the chassis number is unique everywhere and the plate only
          within a company.
        type: string
      color:
        type: string
      companyId:
        type: string
      createdAt:
        type: string
      currentDriverId:
        description: |-
          CurrentDriverID is the drivers document; CurrentDriverUserID is that
          driver's auth user, copied from the document when they have a login.
          Both are written by the same assignment path; the second stays because
          business-service's dispatch reads driver ids as auth users and a
          driver with no login must contribute nothing there.
        type: string
      currentDriverUserId:
        type: string
      engineNumber:
        type: string
      fuelRatioKmpl:
        type: number
      fuelTankLiters:
        type: number
      hourmeterHours:
        type: number
      id:
        type: string
      isAvailable:
        description: TMS asks this before assigning a load; FMS does not care.
        type: boolean
      licensePlate:
        description: What everyone calls the truck, exactly as the operator typed
          it.
        type: string
      notes:
        type: string
      odometerKm:
        type: number
      status:
        type: string
      trackerId:
        description: |-
          TrackerID is a COPY of the live tracker assignment, kept so "which device
          is on this vehicle" does not need a query over history.

          Nothing in MongoDB keeps it in step. In PostgreSQL a trigger did; here
          every writer must, and a writer that forgets shows a device on the wrong
          truck. Use the tracker repository's fitting methods rather than setting
          this directly.
        type: string
      truckBodyId:
        type: string
      truckGroupId:
        description: |-
          TruckGroupID is the vehicle group (vehicle_groups) this unit belongs
          to — one, since FMS's fleet group is single-valued and the two products
          share the field (Truck.truck_group_id on the wire).
        type: string
      truckHeadId:
        description: |-
          A head names a head type; a body or a rigid names a body type. Both
          fields rather than one, because a rigid truck has a body and no separate
          head — forcing them through one field would mean guessing which list an
          id belongs to.
        type: string
      unitType:
        $ref: '#/definitions/github_com_karlo_masterdata-service_internal_models.UnitType'
      unitYear:
        type: integer
      updatedAt:
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_services.DocumentInput:
    properties:
      docType:
        type: string
      driverId:
        type: string
      expiresOn:
        description: YYYY-MM-DD
        type: string
      fileKey:
        type: string
      issuedOn:
        description: YYYY-MM-DD
        type: string
      notes:
        type: string
      number:
        type: string
      vehicleId:
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_services.DriverInput:
    properties:
      attributes:
        additionalProperties: true
        type: object
      employeeNo:
        type: string
      fullName:
        type: string
      licenseClass:
        type: string
      licenseExpiry:
        description: YYYY-MM-DD; "" clears
        type: string
      licenseNo:
        type: string
      notes:
        type: string
      phone:
        type: string
      status:
        type: string
      userId:
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_services.DriverRef:
    properties:
      fullName:
        type: string
      id:
        type: string
      phone:
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_services.FitInput:
    properties:
      fittedAt:
        type: string
      installNotes:
        type: string
      installPhotoKey:
        type: string
      installedByUserId:
        type: string
      vehicleId:
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_services.TrackerInput:
    properties:
      attributes:
        additionalProperties: true
        type: object
      companyId:
        description: |-
          CompanyID moves a device between Karlo's stock and a company (or
          between companies). Platform staff only; ignored for everyone else.
          This is how the backfilled stock is handed to the companies that
          actually run the devices.
        type: string
      deviceId:
        type: string
      iccid:
        type: string
      imei:
        description: accepted as an alias of deviceId for gps
        type: string
      kind:
        type: string
      modelId:
        type: string
      owner:
        type: string
      ownerName:
        type: string
      phoneNo:
        type: string
      simProvider:
        type: string
      status:
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_services.TrackerRef:
    properties:
      deviceId:
        type: string
      id:
        type: string
      kind:
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_services.TrackerView:
    properties:
      attributes:
        additionalProperties: true
        type: object
      companyId:
        description: |-
          Where the device is DEPLOYED. Nil while it sits in Karlo's stock, which
          is why this is optional when nearly every other CompanyID is not.
        type: string
      createdAt:
        type: string
      currentVehicleId:
        type: string
      deviceId:
        description: |-
          DeviceID is the device's identity within its kind — the IMEI for a
          GPS tracker, the vendor's device id for a dashcam — and it is GLOBAL:
          two companies cannot hold the same physical device, and a duplicate
          means one vehicle's telemetry appearing on another's map.
        type: string
      fittedAt:
        type: string
      iccid:
        description: |-
          The SIM card itself. Survives the number changing, which a phone number
          does not — a number is reassigned, an ICCID identifies the card.
        type: string
      id:
        type: string
      imei:
        description: |-
          IMEI is kept for GPS trackers, equal to DeviceID, because every
          telemetry reading and assignment is keyed on it. Empty for a dashcam.
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/github_com_karlo_masterdata-service_internal_models.TrackerKind'
        description: |-
          Kind is what the device is: a GPS tracker or a dashcam. One register,
          because both are a physical device fitted to a vehicle with a fitting
          history, and two registers is how one vehicle ends up with a device
          in each that nobody can see together.
      modelId:
        description: |-
          The model, always by reference. A free-text name sat beside this for
          devices not yet catalogued, and it was the wrong answer: two spellings of
          one model cannot be compared, so "every device of this model" — the
          question asked when a firmware fault appears — would miss half of them.
        type: string
      owner:
        allOf:
        - $ref: '#/definitions/github_com_karlo_masterdata-service_internal_models.TrackerOwner'
        description: |-
          Who OWNS it — a different question from where it is, and the two differ
          constantly. Without the distinction nobody can answer "which of our units
          are out with customers" or "who do we chase when this one fails".
      ownerName:
        type: string
      phoneNo:
        description: |-
          PhoneNo is the SIM's MSISDN — how the device is reached for SMS
          commands. FMS keeps it per device; kept here so the two agree.
        type: string
      simProvider:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_services.UnfitInput:
    properties:
      unfittedAt:
        type: string
    type: object
  github_com_karlo_masterdata-service_internal_services.VehicleInput:
    properties:
      attributes:
        additionalProperties: true
        type: object
      brandId:
        type: string
      chassisNumber:
        type: string
      color:
        type: string
      currentDriverId:
        type: string
      engineNumber:
        type: string
      fuelRatioKmpl:
        type: number
      fuelTankLiters:
        type: number
      hourmeterHours:
        type: number
      isAvailable:
        type: boolean
      licensePlate:
        type: string
      notes:
        type: string
      odometerKm:
        type: number
      status:
        type: string
      truckBodyId:
        type: string
      truckGroupId:
        type: string
      truckHeadId:
        type: string
      unitType:
        type: string
      unitYear:
        type: integer
    type: object
  github_com_karlo_masterdata-service_internal_services.VehicleView:
    properties:
      attributes:
        additionalProperties: true
        type: object
      brandId:
        type: string
      chassisNumber:
        description: |-
          The numbers that identify the PHYSICAL vehicle rather than its
          registration. A plate is reissued when a vehicle is sold; these are not,
          which is why the chassis number is unique everywhere and the plate only
          within a company.
        type: string
      color:
        type: string
      companyId:
        type: string
      createdAt:
        type: string
      currentDriverId:
        description: |-
          CurrentDriverID is the drivers document; CurrentDriverUserID is that
          driver's auth user, copied from the document when they have a login.
          Both are written by the same assignment path; the second stays because
          business-service's dispatch reads driver ids as auth users and a
          driver with no login must contribute nothing there.
        type: string
      currentDriverUserId:
        type: string
      driver:
        $ref: '#/definitions/github_com_karlo_masterdata-service_internal_services.DriverRef'
      engineNumber:
        type: string
      fuelRatioKmpl:
        type: number
      fuelTankLiters:
        type: number
      hourmeterHours:
        type: number
      id:
        type: string
      isAvailable:
        description: TMS asks this before assigning a load; FMS does not care.
        type: boolean
      licensePlate:
        description: What everyone calls the truck, exactly as the operator typed
          it.
        type: string
      notes:
        type: string
      odometerKm:
        type: number
      status:
        type: string
      tracker:
        $ref: '#/definitions/github_com_karlo_masterdata-service_internal_services.TrackerRef'
      trackerId:
        description: |-
          TrackerID is a COPY of the live tracker assignment, kept so "which device
          is on this vehicle" does not need a query over history.

          Nothing in MongoDB keeps it in step. In PostgreSQL a trigger did; here
          every writer must, and a writer that forgets shows a device on the wrong
          truck. Use the tracker repository's fitting methods rather than setting
          this directly.
        type: string
      truckBodyId:
        type: string
      truckGroupId:
        description: |-
          TruckGroupID is the vehicle group (vehicle_groups) this unit belongs
          to — one, since FMS's fleet group is single-valued and the two products
          share the field (Truck.truck_group_id on the wire).
        type: string
      truckHeadId:
        description: |-
          A head names a head type; a body or a rigid names a body type. Both
          fields rather than one, because a rigid truck has a body and no separate
          head — forcing them through one field would mean guessing which list an
          id belongs to.
        type: string
      unitType:
        $ref: '#/definitions/github_com_karlo_masterdata-service_internal_models.UnitType'
      unitYear:
        type: integer
      updatedAt:
        type: string
    type: object
  internal_handlers.errorBody:
    properties:
      message:
        example: Entry not found.
        type: string
      success:
        example: false
        type: boolean
    type: object
  internal_handlers.kindInfo:
    properties:
      kind:
        type: string
      shareable:
        description: |-
          Shareable is false for a catalogue whose entries always belong to one
          company — a vehicle group, an item. Sent so a staff form offers "shared
          with everyone" only where that is possible.
        type: boolean
      writable:
        description: |-
          Writable is false for a catalogue that can be read and not edited. Sent
          so the UI can omit the add button rather than offering one that fails.
        type: boolean
    type: object
  internal_handlers.warehouseRequest:
    properties:
      address:
        type: string
      city:
        type: string
      customerCompanyId:
        description: The customer this site belongs to (MyWarehouse groups per customer).
        type: string
      district:
        type: string
      geofenceRadiusMeters:
        type: integer
      latitude:
        description: |-
          Pointers, so "not supplied" stays distinct from zero. Nought, nought is
          a real place and the service refuses it; a nil pair means the site has
          no coordinate yet, which is allowed.
        type: number
      longitude:
        type: number
      name:
        type: string
      notes:
        type: string
      picName:
        type: string
      picPhone:
        type: string
      postcode:
        type: string
      province:
        type: string
      siteType:
        type: string
      street:
        type: string
    required:
    - name
    type: object
host: localhost:5002
info:
  contact:
    email: engineering@karlo.co.id
    name: Karlo Engineering
  description: 'Reference data. Global catalogues (brands, truck types, cargo types,
    items, tracker models) shared by every company, and per-company registers (customers,
    vehicle groups, trucks, warehouses).\n\nEvery endpoint needs a bearer token from
    the authentication service. Karlo staff may act for a client by sending X-Acting-For:
    <companyId>.'
  title: Karlo Master Data API
  version: "1.0"
paths:
  /catalog:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handlers.kindInfo'
            type: array
      security:
      - BearerAuth: []
      summary: Catalogue kinds
      tags:
      - catalog
  /catalog/{kind}:
    get:
      parameters:
      - description: Catalogue kind
        in: path
        name: kind
        required: true
        type: string
      - description: Restrict to children of this entry (e.g. sub-categories of a
          category)
        in: query
        name: parentId
        type: string
      - description: Zero-based page
        in: query
        name: page
        type: integer
      - description: Rows per page
        in: query
        name: pageSize
        type: integer
      - description: Free-text search
        in: query
        name: search
        type: string
      - description: Sort, e.g. name:asc
        in: query
        name: sorted
        type: string
      - description: Filters as field:value, comma separated
        in: query
        name: filtered
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success, data[], meta{page,limit,totalRows,totalPages}
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List one catalogue
      tags:
      - catalog
    post:
      consumes:
      - application/json
      description: Karlo staff create shared entries; a company creates its own. Fields
        depend on the kind — see the models for each catalogue (Brand, CargoType,
        Item, TruckHead, TruckBody, TruckClass, Customer, VehicleGroup, TrackerModel…).
      parameters:
      - description: Catalogue kind, from GET /catalog
        in: path
        name: kind
        required: true
        type: string
      - description: Entry fields for the kind
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.errorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handlers.errorBody'
      security:
      - BearerAuth: []
      summary: Add a catalogue entry
      tags:
      - catalog
  /catalog/{kind}/{id}:
    delete:
      description: 'Soft: documents already referencing it keep resolving; the name
        frees up.'
      parameters:
      - description: Catalogue kind
        in: path
        name: kind
        required: true
        type: string
      - description: Entry id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.errorBody'
      security:
      - BearerAuth: []
      summary: Retire a catalogue entry
      tags:
      - catalog
    get:
      parameters:
      - description: Catalogue kind
        in: path
        name: kind
        required: true
        type: string
      - description: Entry id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.errorBody'
      security:
      - BearerAuth: []
      summary: Get a catalogue entry
      tags:
      - catalog
    put:
      consumes:
      - application/json
      parameters:
      - description: Catalogue kind
        in: path
        name: kind
        required: true
        type: string
      - description: Entry id
        in: path
        name: id
        required: true
        type: string
      - description: Changed fields
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handlers.errorBody'
      security:
      - BearerAuth: []
      summary: Edit a catalogue entry
      tags:
      - catalog
  /documents:
    get:
      description: One of vehicleId or driverId is required unless expiringWithinDays
        is set, which sweeps the company.
      parameters:
      - description: Owner vehicle
        in: query
        name: vehicleId
        type: string
      - description: Owner driver
        in: query
        name: driverId
        type: string
      - description: Only documents expiring within N days
        in: query
        name: expiringWithinDays
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success, data []models.Document, meta
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List documents
      tags:
      - documents
    post:
      consumes:
      - application/json
